<header class="mtop">
  <button class="mbtn" id="mClose" hidden>✕ 返回學院</button>
  <div class="mtitle"><b>迷宮尋寶</b><small>角色冒險・36 關</small></div>

</header>
<main class="mwrap">
  <section class="mintro">
    <p>操作背包客走進迷宮，把每顆寶石搬進同顏色的寶箱。完成時間越短，得到的智慧星星越多：</p>
    <ul>
      <li><b>★</b> 8 分鐘內完成（國小一年級）</li>
      <li><b>★★</b> 達到國中二年級的速度</li>
      <li><b>★★★</b> 達到高中三年級的速度</li>
    </ul>
    <p class="mnote">完成前一關就能挑戰下一關。智慧星星會存進學院大廳的商店，未來可以兌換商品；同一關重玩只會補上新多出來的星星。</p>
  </section>
  <div id="mList"></div>
  <p class="mmulti"><a id="mMulti" href="https://maze-game-iryd.onrender.com/" target="_blank" rel="noopener">👥 多人連線版（大螢幕＋手機方向鍵）</a></p>
