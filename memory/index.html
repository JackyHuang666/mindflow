/* memory strategy preparation screen */
const STRAT={group:'分組法',story:'故事聯想法',image:'圖像法',rhythm:'節奏法'};
const STRAT_HINT={group:'把資訊切成幾組，一組一組記。',story:'把圖案串成一個有劇情的小故事。',image:'把每個圖案放進腦中熟悉的場景裡。',rhythm:'用聲音的節奏和拍子，替順序加上線索。'};
async function stratPrep(ctx,ui,host,items,modes,secs,need){
  host.replaceChildren();
  const mrow=mkDiv('row'),info=mkDiv('cap'),board=mkDiv('stack');host.append(mrow,info,board);
  let chosen=null,ready=false,playing=false,warned=false;
  const cellsRow=(arr,off)=>{const r=mkDiv('row');arr.forEach((it,j)=>r.appendChild(mkCell(gI(it)+`<span class="tg">${off+j+1}</span>`,'cell')));return r};
  const render=()=>{board.replaceChildren();const n=items.length;
    if(chosen==='group'){const sz=n===10?[4,3,3]:n===9?[3,3,3]:[3,3,2];let o=0;sz.forEach((s,gi)=>{board.append(mkDiv('cap',`第 ${gi+1} 組`),cellsRow(items.slice(o,o+s),o));o+=s})}
    else if(chosen==='story'){const r=mkDiv('row');items.forEach((it,j)=>{if(j)r.insertAdjacentHTML('beforeend','<span class="cap" style="align-self:center">→</span>');r.appendChild(mkCell(gI(it)+`<span class="tg">${j+1}</span>`,'cell'))});board.append(r)}
    else if(chosen==='image'){const h=Math.ceil(n/2);board.append(mkDiv('cap','房間 A'),cellsRow(items.slice(0,h),0),mkDiv('cap','房間 B'),cellsRow(items.slice(h),h))}
    else if(chosen==='rhythm'){board.append(cellsRow(items,0));const pb=mkBtn('▶ 播放節奏');pb.onclick=async()=>{if(playing)return;playing=true;try{for(let j=0;j<items.length;j++){tone(items[j].p,j%3===0?.45:.22,'triangle',.22);await ctx.sleep(j%3===2?520:300)}}finally{playing=false}};board.append(pb)}
    else board.append(cellsRow(items,0));
    info.textContent=chosen?STRAT_HINT[chosen]:'請選一種記憶策略來整理這些資訊';
    mrow.replaceChildren(...modes.map(m=>{const b=mkBtn(STRAT[m],m===chosen);b.onclick=()=>{chosen=m;render()};return b}));
  };
  render();
  const bw=mkDiv('bar','<i style="transition-duration:'+secs+'s"></i>'),rb=mkBtn('我準備好了',1);
  ui.aux.replaceChildren(bw,rb);const bi=bw.firstChild;void bi.offsetWidth;bi.style.width='0%';
  rb.onclick=()=>{if(need&&!chosen){ui.msg('請先選一種策略','rule');return}ready=true};
  const t0=Date.now();
  while(!ready){await ctx.sleep(100);if(Date.now()-t0>secs*1000){if(chosen||!need)break;if(!warned){warned=true;ui.msg('時間到，但請先選一種策略！','rule')}}}
  ui.aux.replaceChildren();return chosen;
}

/* level 41: cross-sensory rebuild */
async function crossEngine(ctx,cfg,ui){
  const N=8,ids=pids().slice(0,N),cs=shuf(COLK).slice(0,N),ps=shuf(PITCH8),items=ids.map((id,i)=>({id,k:cs[i],p:ps[i]}));
  const {disp,ans}=mkStack(ui);const present=mkPresent(ctx,ui,disp,items,{msg:'看圖案、顏色，也聽聲音'});
  ui.msg('準備…');await ctx.sleep(900);await present();disp.hidden=true;ans.hidden=false;
  let cm='';const say=t=>{cm=t;ui.msg(t)};wireReplay(ctx,ui,disp,ans,present,()=>cm);
  const parts=[
    {t:'第 1 / 3 部分：圖案出現的原始順序',run:()=>orderFill(ctx,ui,ans,shuf(items).map(it=>iconOpt(it,true)),N,4,items.map(x=>x.id))},
    {t:'第 2 / 3 部分：把每個圖案配回原本的顏色',run:()=>{const o=shuf(items);return assignBoard(ctx,ui,ans,o.map(gG),colorOpts(),4,o.map(x=>x.k))}},
    {t:'第 3 / 3 部分：把聲音（音高 1–8）配回圖案，點音高可試聽',run:()=>{const o=shuf(items);return assignBoard(ctx,ui,ans,o.map(gG),pitchOpts8(),4,o.map(x=>x.p))}}];
  for(const P of parts){ans.replaceChildren();ui.aux.replaceChildren();say(P.t);const R=await P.run();
    if(!R.ok){ctx.setReplay(null);return failEnd(ctx,ui,'這一部分有錯，右下角是正確答案',3400)}

  ctx.setReplay(null);return passEnd(ctx,ui,'8 組資訊全部重建成功！');
}

/* level 42: 4x4 maze */
async function mazeEngine(ctx,cfg,ui){
  let pathA,pathB,others;
  for(;;){const r1=rnd(4),c1=rnd(2),dr=[1,2,-1,-2][rnd(4)],r2=r1+dr;if(r2<0||r2>3)continue;
    pathA=[r1*4+c1,r1*4+c1+1];pathB=[r2*4+c1+1,r2*4+c1+2];if(pathA.some(x=>pathB.includes(x)))continue;
    others=shuf([...Array(16).keys()].filter(x=>!pathA.concat(pathB).includes(x))).slice(0,4);break}
  const seq=[others[0],pathA[0],pathA[1],others[1],others[2],pathB[0],pathB[1],others[3]];
  const op=shuf([294,392,415,440]),tones=[op[0],262,330,op[1],op[2],277,349,op[3]];
  const {disp,ans}=mkStack(ui);const g=mkDiv('cgrid');g.style.setProperty('--cols',4);disp.append(g);
  const cells=[...Array(16)].map((_,i)=>{const b=mkCell(`<span class="tg" style="position:static;opacity:.6;font-size:.8rem">${i+1}</span>`,'cell big');g.appendChild(b);return b});
  async function present(){
    for(let i=0;i<8;i++){const c=cells[seq[i]];c.classList.add('lit');tone(tones[i],.7,'triangle',.24);ui.msg('看亮起的格子，聽音調','listen');ui.aux.innerHTML=`<span class="cap">${i+1} / 8</span>`;await ctx.sleep(850);c.classList.remove('lit');await ctx.sleep(260)}
    ui.aux.replaceChildren();
  }
  ui.msg('準備…');await ctx.sleep(900);ui.msg('記住亮起的順序。小心：有兩段路線形狀很像','rule');await ctx.sleep(1600);
  await present();disp.hidden=true;ans.hidden=false;
  const inMsg='依序走過亮過的格子（照原順序點格子）';ui.msg(inMsg);wireReplay(ctx,ui,disp,ans,present,()=>inMsg);
  const opts=[...Array(16)].map((_,i)=>({key:i,html:`<span class="tg" style="position:static;opacity:.6;font-size:.8rem">${i+1}</span>`,label:'第'+(i+1)+'格'}));
  const A=answerSeq(ctx,ui,ans,opts,seq,4);const ok=await A.promise;ctx.setReplay(null);
  if(!ok)return failEnd(ctx,ui,'正確路線（格子編號）：'+seq.map(i=>i+1).join(' → '),3600);
  sfxOk();await sleepSafe(ctx,800);
  // sound check
  for(const q of shuf([...Array(8).keys()]).slice(0,3)){
    ans.replaceChildren();ui.aux.replaceChildren();
    const g2=mkDiv('cgrid');g2.style.setProperty('--cols',4);cells.forEach((_,i)=>g2.appendChild(mkCell(`<span class="tg" style="position:static;opacity:.6;font-size:.8rem">${i+1}</span>`,'cell'+(i===seq[q]?' lit':''))));
    ans.append(g2);ui.msg(`亮起的這一格（第 ${seq[q]+1} 格）是第幾級音？點音高可試聽`);
    const ps=[262,277,294,330,349,392,415,440],po=ps.map((f,i)=>noteOpt(f,i+1,i,8));
    const B=answerSeq(ctx,ui,ans,po,[tones[q]],4,true);
    if(!await B.promise)return failEnd(ctx,ui,`那一格的音高是第 ${ps.indexOf(tones[q])+1} 級`);
    sfxOk();await sleepSafe(ctx,600);
  }
  return passEnd(ctx,ui,'8 個位置與聲音順序都正確！');
}

/* level 43: own strategy */

  ans.replaceChildren();ui.msg('資訊已隱藏！依序點出 10 個圖案（可「退一步」）');

  ctx.strategy=choice;
  return passEnd(ctx,ui,choice==='none'?'已記錄。下次試試選一種策略，會更輕鬆！':`已記錄：你使用了「${STRAT[choice]}」。${chosen&&chosen!==choice?'（準備時你選的是「'+STRAT[chosen]+'」）':''}`,2200);

/* 20-second spatial pairing task (interference) */
async function pairGame(ctx,ui,host,secs){
  const cols=shuf(COLK).slice(0,4),cards=shuf([...cols,...cols]),st=cards.map(()=>({up:true,done:false}));
  const g=mkDiv('cgrid');g.style.setProperty('--cols',4);host.replaceChildren(g);
  const bs=cards.map(()=>{const b=mkCell('','cell big');g.appendChild(b);return b});
  const paint=()=>bs.forEach((b,i)=>{const s=st[i],sh=s.up||s.done;b.innerHTML=sh?ballSVG(COL[cards[i]][0]):'?';b.classList.toggle('q',!sh);b.classList.toggle('ok',s.done)});
  paint();ui.msg('記住 4 種顏色的位置');await ui.countdown(2.5);st.forEach(s=>s.up=false);paint();
  ui.msg(`配對任務（${secs} 秒）：翻開兩張，找出同色的一對`,'rule');
  ui.aux.innerHTML='<div class="bar"><i style="transition:none;width:100%"></i></div>';const bi=ui.aux.querySelector('i');
  let first=-1,busy=false,pairs=0;
  bs.forEach((b,i)=>b.onclick=()=>{if(busy||st[i].up||st[i].done)return;st[i].up=true;tone(500,.08);paint();
    if(first<0){first=i;return}const a=first;first=-1;
    if(cards[a]===cards[i]){st[a].done=st[i].done=true;st[a].up=st[i].up=false;pairs++;sfxOk();paint()}
    else{busy=true;setTimeout(()=>{st[a].up=st[i].up=false;paint();busy=false},600)}});
  const end=Date.now()+secs*1000;
  while(Date.now()<end&&pairs<4){bi.style.width=Math.max(0,(end-Date.now())/(secs*10))+'%';await ctx.sleep(80)}
  bs.forEach(b=>b.onclick=null);ui.aux.replaceChildren();host.replaceChildren();
}

/* level 45: final trial with scoring */
function triPick(ctx,ui,host,it,exp){

  const pg=mkDiv('cgrid');pg.style.setProperty('--cols',4);const cr=mkDiv('row'),pr=mkDiv('row');host.append(fig,pg,cr,pr);
  const okb=mkBtn('確認這個圖案',1);okb.disabled=true;ui.aux.replaceChildren(okb);
  const pb=[...Array(16)].map((_,i)=>{const b=mkCell(`<span class="tg" style="position:static;opacity:.6;font-size:.8rem">${i+1}</span>`,'cell');b.onclick=()=>{st.pos=i;draw()};pg.appendChild(b);return b});
  const co=COLK.map(k=>{const b=mkCell(planetSVG(k),'cell');b.setAttribute('aria-label',COL[k][1]);b.onclick=()=>{st.color=k;draw()};cr.appendChild(b);return b});
  const po=PITCH8S.map((f,i)=>{const o=noteOpt(f,i+1,i,8),b=mkCell(o.html,'cell');b.onclick=()=>{st.pitch=f;o.snd();draw()};pr.appendChild(b);return b});
  const draw=()=>{pb.forEach((b,i)=>b.classList.toggle('sel',st.pos===i));co.forEach((b,i)=>b.classList.toggle('sel',st.color===COLK[i]));po.forEach((b,i)=>b.classList.toggle('sel',st.pitch===PITCH8S[i]));okb.disabled=st.pos==null||!st.color||!st.pitch};
  return new Promise(res=>okb.onclick=()=>{ui.aux.replaceChildren();host.style.pointerEvents='none';const hit=(st.pos===exp.pos)+(st.color===exp.color)+(st.pitch===exp.pitch);
    pb[exp.pos].classList.add('ok');if(st.pos!==exp.pos&&st.pos!=null)pb[st.pos].classList.add('no');res({score:hit/3,ok:hit===3});host.style.pointerEvents=''});
}

    ['規則改變：只看「形狀」，依出現順序點出圖案',()=>orderFill(ctx,ui,stack,shuf(it4.map(it=>iconOpt(it,true)).concat(pids().filter(x=>!r4.includes(x)).slice(0,2).map(id=>iconOpt({id},true)))),4,3,it4.map(x=>x.id))],
    ['規則再變：依「聲音高低」，由低到高點出圖案',()=>orderFill(ctx,ui,stack,shuf(it4).map(it=>iconOpt(it,false)),4,4,it4.slice().sort((a,b)=>a.p-b.p).map(x=>x.id))]];
   for(const [t,run] of rules){stack.replaceChildren();await stageBanner(ctx,ui,t,1700);ui.msg(t);const R=await run();tot+=R.score;await sleepSafe(ctx,1300)}
   note('規則切換',tot/3)}
  // 5 delayed recall
  await stageBanner(ctx,ui,'階段 5 / 7 延遲回憶：回想階段 1 的 10 個圖案');stack.replaceChildren();
  note('延遲回憶',await recog('這 10 個圖案是階段 1 看過的嗎？選出它們（形狀與顏色都要對）'));
  // 6 strategy
  await stageBanner(ctx,ui,'階段 6 / 7 策略挑戰：自選策略，記住指定序列',2000);
  {const s8=pids().slice(0,8),pp=shuf(NOTE10).slice(0,8),it8=s8.map((id,i)=>({id,p:pp[i]}));
   const pr=mkPresent(ctx,ui,stack,it8,{msg:'看圖案，聽聲音',on:1000,gap:240});await pr();
   ui.msg('策略準備 12 秒：必須選一種（分組、故事或節奏）');
   const ch=await stratPrep(ctx,ui,stack,it8,['group','story','rhythm'],12,true);stack.replaceChildren();
   ui.msg(`用「${STRAT[ch]}」依序點出 8 個圖案`);
   const R=await orderFill(ctx,ui,stack,shuf(it8).map(it=>({key:it.id,html:glyphSVG(it.id),label:G[it.id].n})),8,4,it8.map(x=>x.id));strategyDone=true;note('策略挑戰',R.score);await sleepSafe(ctx,1500)}
  // 7 rebuild
  await stageBanner(ctx,ui,'最終階段 宇宙重建：把圖案、聲音、顏色、位置整合成記憶地圖',2200);
  {const r5=pids().slice(0,5),c5=shuf(COLK).slice(0,5),p5=shuf(PITCH8S).slice(0,5),cl=shuf([...Array(16).keys()]).slice(0,5),it5=r5.map((id,i)=>({id,k:c5[i],p:p5[i],pos:cl[i]}));
   const g=mkDiv('cgrid');g.style.setProperty('--cols',4);const cs=[...Array(16)].map((_,i)=>{const b=mkCell(`<span class="tg" style="position:static;opacity:.5;font-size:.8rem">${i+1}</span>`,'cell big');g.appendChild(b);return b});
   stack.replaceChildren(g);ui.msg('看每個圖案出現在哪格、什麼顏色、什麼聲音','listen');
   for(let i=0;i<5;i++){const it=it5[i];cs[it.pos].innerHTML=gI(it);cs[it.pos].classList.add('lit');tone(it.p,.8,'triangle',.24);ui.aux.innerHTML=`<span class="cap">${i+1} / 5</span>`;await ctx.sleep(1700);cs[it.pos].classList.remove('lit')}
   await ctx.sleep(1500);ui.aux.replaceChildren();
   let tot=0;
   for(const it of shuf(it5)){ui.msg(`這個圖案原本在哪一格、什麼顏色、什麼聲音？（${G[it.id].n}）`);const R=await triPick(ctx,ui,stack,it,{pos:it.pos,color:it.k,pitch:it.p});tot+=R.score;await sleepSafe(ctx,1100)}
   note('宇宙重建',tot/5)}
  stack.replaceChildren();
  return await finish();
}
